<!doctype html>
<html><head><meta charset="utf-8"><title>stylized-systems-hero</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* stylized-systems at 1920 x 1080: the four isolated systems, each tile 800 CSS px wide at scale 1 from a
     1440 px wide capture crop, so nothing is enlarged. System colours from App.xaml (Graphite): SystemSteamWater
     #E8899C, SystemCooling #56C4B6, SystemFuelFlue #AD90DB, SystemElectrical #E2B652; Background #16181B. */
  .stage { background: radial-gradient(100% 100% at 50% 45%, #1C1F23 0%, #16181B 55%, #101215 100%); --grain: .05; }
  .wall { position: absolute; left: 148px; top: 70px; width: 1624px; height: 940px;
    transform: perspective(3800px) rotateY(-9deg) rotateX(3deg); transform-origin: 30% 50%;
    display: grid; grid-template-columns: 800px 800px; grid-template-rows: 453px 453px; gap: 24px 24px; }
  .tile { position: relative; border-radius: 12px; overflow: hidden; background: #16181B;
    box-shadow: 0 0 0 1px rgba(232,234,236,.10), 0 0 0 8px #24282D, 0 0 0 9px rgba(232,234,236,.06),
                0 26px 60px -16px rgba(0,0,0,.7), 0 0 90px -20px var(--c); }
  .tile img { width: 100%; height: 100%; }
  .tile::after { content: ''; position: absolute; inset: 0; border-radius: 12px;
    background: linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,0) 35%); }
</style></head>
<body><div class="stage grain">
  <div class="wall">
    <div class="tile" style="--c: rgba(232,137,156,.85)"><img src="cap/dark-system-steam@2x.png"></div>
    <div class="tile" style="--c: rgba(86,196,182,.8)"><img src="cap/dark-system-cooling@2x.png"></div>
    <div class="tile" style="--c: rgba(173,144,219,.85)"><img src="cap/dark-system-fuel@2x.png"></div>
    <div class="tile" style="--c: rgba(226,182,82,.75)"><img src="cap/dark-system-elec@2x.png"></div>
  </div>
</div></body></html>
