<!doctype html>
<html><head><meta charset="utf-8"><title>focus-trends</title>
<link rel="stylesheet" href="frames.css">
<style>
  /* Synchronized trends, Graphite, 1 hour: net generation, basin temperature and fan vibration crossing its 4.5 mm/s
     limit (AlertColor #F0793A, dashed), the shared cursor parked on a vibration peak with a dot on every trend, and the
     alarm onset marker. The band (Surface #33373D) is turned toward the viewer like a console desk, whole, so the cursor dots and the onset marker stay in frame and falls off into
     the Graphite Background #16181B under a slate-teal light (Primary #7FB3C8). */
  .stage { background:
      radial-gradient(55% 60% at 50% 52%, rgba(127,179,200,.12) 0%, rgba(127,179,200,0) 70%),
      radial-gradient(100% 90% at 50% 40%, #1C1F23 0%, #16181B 55%, #111316 100%); --grain: .04; }
  .iso-grid { --iso-ink: rgba(110,118,127,.10); --iso-size: 46px; --iso-mask: 90% 70% at 50% 60%; }
  .desk { position: absolute; left: 60px; top: 128px; width: 1080px; height: 352.5px; border-radius: 12px; overflow: hidden;
    transform-origin: 50% 50%; transform: perspective(2000px) rotateX(12deg) rotateY(-10deg);
    box-shadow: 0 0 0 1px rgba(232,234,236,.08), 0 30px 60px -16px rgba(0,0,0,.65); }
  .desk img { width: 100%; height: 100%; }
  .desk::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0) 30%); }
</style></head>
<body><div class="stage grain">
  <div class="iso-grid"></div>
  <div class="desk"><img src="cap/dark-trends@2x.png"></div>
</div></body></html>
