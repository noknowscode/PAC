name: CI

on:
  push:
    branches: [main, release/**]
    tags: ['v*']
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: PacConsole/PacConsole.csproj

jobs:
  test:
    name: Unit tests (Core and the page model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Test
        # The tests reference the app's plain net10.0 build (the page model, the journal, the renderer); the override
        # keeps restore off the mobile heads, so no workload is needed.
        run: dotnet test PacConsole.Tests/PacConsole.Tests.csproj -c Release -p:PacTargetFrameworks=net10.0

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-desktop -c Release -r ${{ matrix.rid }} --self-contained -p:PacTargetFrameworks=net10.0-desktop -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: pacconsole-desktop-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  windows:
    name: Windows (WinAppSDK build check)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build the WinAppSDK head (x64, unsigned)
        # The Skia desktop job above covers Windows too, through Win32. This one proves the native WinUI head compiles;
        # SKCanvasElement (the plant, thumbnails and trends) needs x64 or ARM64 there, never AnyCPU.
        run: dotnet build ${{ env.PROJECT }} -f net10.0-windows10.0.19041 -c Release -p:Platform=x64 -p:PacTargetFrameworks=net10.0-windows10.0.19041

  wasm:
    name: WebAssembly
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools
      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-browserwasm -c Release -p:PacTargetFrameworks=net10.0-browserwasm -o publish/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: pacconsole-wasm
          path: publish/wasm/wwwroot

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Install android workload
        run: dotnet workload install android
      - name: Restore signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pacconsole.keystore"
      - name: Publish (signed when the keystore secrets exist, debug-signed otherwise)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          SIGN=""
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            SIGN="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/pacconsole.keystore -p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_STORE_PASSWORD"
          fi
          # One format per publish: a list value did not produce both packages.
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:PacTargetFrameworks=net10.0-android -p:AndroidPackageFormat=aab $SIGN -o publish/android
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:PacTargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk $SIGN -o publish/android
      - uses: actions/upload-artifact@v4
        with:
          name: pacconsole-android
          path: |
            publish/android/*.aab
            publish/android/*.apk

  android-emulator:
    name: Android (emulator smoke test)
    # Installs the APK the Android job built on an x86_64 emulator, launches it, and fails on a crash, a blank first
    # frame or a missing content marker. Evidence (screenshot, window dump, logcat, timing) is uploaded either way.
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Per app. APP_PACKAGE is the csproj's ApplicationId. APP_ACTIVITY is the class marked [Activity(MainLauncher = true)]:
      # .NET for Android names it crc64<hash>.MainActivity unless the attribute sets Name, so the check resolves the
      # launcher and matches its class name (a fully qualified Java name is launched as given). APP_CONTENT_MARKER is a
      # regex for text the first screen shows, read from the accessibility tree (uiautomator dump); APP_LOGCAT_MARKER is
      # an optional regex the app's own logcat lines must contain.
      APP_PACKAGE: com.unoplatform.pacconsole
      APP_ACTIVITY: MainActivity
      APP_CONTENT_MARKER: Net output
      APP_LOGCAT_MARKER: ''
      APP_ARTIFACT: pacconsole-android
      APP_SETTLE_SECONDS: '20'
      APP_MARKER_TIMEOUT: '90'
      EMULATOR_API: '34'
      EMULATOR_TARGET: google_apis
      EMULATOR_PROFILE: pixel_6
    steps:
      - name: Record the job start
        run: date +%s > "$RUNNER_TEMP/smoke-job-start"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Restore and save are separate steps so a failing smoke test still caches the snapshot it booted from.
      - name: Restore the AVD snapshot
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API }}-${{ env.EMULATOR_TARGET }}-x86_64-${{ env.EMULATOR_PROFILE }}-v1
      - name: Create the AVD and its boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: x86_64
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated for the cache."
      - name: Save the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API }}-${{ env.EMULATOR_TARGET }}-x86_64-${{ env.EMULATOR_PROFILE }}-v1
      - name: Write the smoke script
        # The emulator runner runs each line of `script` in its own `sh -c`, so the checks live in one bash file.
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-bin"
          cat > "$RUNNER_TEMP/smoke-bin/window_nodes.py" <<'PY'
          """uiautomator window dump helper.
          list <dump> <package|*>: the named nodes (class, bounds, id, text), one per line.
          dismiss <dump> <package>: "x y" of a Wait/Close/OK button in another package's window (a system dialog), or nothing."""
          import re, sys, xml.etree.ElementTree as ET

          mode, path, pkg = sys.argv[1:4]
          try:
              nodes = list(ET.parse(path).getroot().iter("node"))
          except (OSError, ET.ParseError) as e:
              print(f"no readable window dump: {e}" if mode == "list" else "")
              sys.exit(0)
          if mode == "list":
              for n in nodes:
                  if pkg != "*" and n.get("package") != pkg:
                      continue
                  label = n.get("text") or n.get("content-desc") or ""
                  rid = n.get("resource-id", "").split("/")[-1]
                  if label or rid:
                      where = "" if pkg != "*" else n.get("package", "") + " "
                      print(f"{where}{n.get('class', '').split('.')[-1]:<13} {n.get('bounds', ''):<24} {rid:<15} {label[:100]}")
          else:
              for wanted in ("Wait", "Close app", "Close", "OK", "Dismiss"):
                  for n in nodes:
                      if n.get("package") != pkg and (n.get("text") or "").strip() == wanted and n.get("clickable") == "true":
                          x1, y1, x2, y2 = map(int, re.findall(r"\d+", n.get("bounds", "[0,0][0,0]")))
                          print((x1 + x2) // 2, (y1 + y2) // 2)
                          sys.exit(0)
          PY
          cat > "$RUNNER_TEMP/smoke-bin/screen_check.py" <<'PY'
          """Reads a raw `screencap` frame: writes metrics, prints a text thumbnail, and exits 1 when the frame is blank."""
          import json, struct, sys

          raw_path, out_dir = sys.argv[1], sys.argv[2]
          data = open(raw_path, "rb").read()
          w, h, fmt = struct.unpack_from("<III", data, 0)
          hdr = next((n for n in (16, 12) if len(data) - n == w * h * 4), None)
          if hdr is None:
              print(f"unexpected raw frame: {len(data)} bytes for {w}x{h} format {fmt}")
              sys.exit(2)
          px = memoryview(data)[hdr:]

          # Blank check on the band between the status bar and the navigation bar, every 4th pixel.
          n = 0; s = 0.0; s2 = 0.0; counts = {}
          for y in range(int(h * 0.08), int(h * 0.92), 4):
              row = y * w * 4
              for x in range(0, w, 4):
                  i = row + x * 4
                  r, g, b = px[i], px[i + 1], px[i + 2]
                  lum = 0.299 * r + 0.587 * g + 0.114 * b
                  n += 1; s += lum; s2 += lum * lum
                  key = (r >> 3, g >> 3, b >> 3)
                  counts[key] = counts.get(key, 0) + 1
          mean = s / n
          std = max(0.0, s2 / n - mean * mean) ** 0.5
          dominant = max(counts.values()) / n
          blank = std < 2.0 or dominant > 0.995
          metrics = {"width": w, "height": h, "luma_mean": round(mean, 2), "luma_std": round(std, 2),
                     "dominant_color_share": round(dominant, 4), "distinct_colors": len(counts), "blank": blank}
          json.dump(metrics, open(f"{out_dir}/screen-metrics.json", "w"), indent=2)
          print(json.dumps(metrics))

          # Text thumbnail of the whole frame, readable in the job log: each cell is its mean distance from the dominant
          # colour, so the background is blank in either theme and text, controls and drawings show as marks.
          bg = [(c << 3) + 4 for c in max(counts, key=counts.get)]
          cols = 54; rows = max(1, round(cols * h / w / 2)); cw = w / cols; ch = h / rows
          ramp = " .:-=+*#%@"
          lines = []
          for cy in range(rows):
              line = ""
              for cx in range(cols):
                  acc = 0; m = 0
                  for y in range(int(cy * ch), int((cy + 1) * ch), 4):
                      for x in range(int(cx * cw), int((cx + 1) * cw), 4):
                          i = (y * w + x) * 4
                          acc += abs(px[i] - bg[0]) + abs(px[i + 1] - bg[1]) + abs(px[i + 2] - bg[2])
                          m += 1
                  line += ramp[min(len(ramp) - 1, int(acc / max(m, 1) / 3 / 255 * (len(ramp) - 1) * 4))]
              lines.append(line)
          open(f"{out_dir}/thumbnail.txt", "w").write("\n".join(lines) + "\n")
          print(f"::group::Text thumbnail ({cols}x{rows} cells of {w}x{h})")
          print("+" + "-" * cols + "+")
          for line in lines:
              print("|" + line + "|")
          print("+" + "-" * cols + "+")
          print("::endgroup::")
          sys.exit(1 if blank else 0)
          PY
          cat > "$RUNNER_TEMP/smoke-bin/smoke.sh" <<'SH'
          #!/usr/bin/env bash
          # Runs inside the emulator runner once the emulator has booted; ANDROID_SERIAL names it.
          set -uo pipefail
          OUT="$RUNNER_TEMP/smoke"; BIN="$RUNNER_TEMP/smoke-bin"; PKG="$APP_PACKAGE"
          PKG_RE=$(printf '%s' "$PKG" | sed 's/\./\\./g')
          RESULTS=(); FAILED=0
          check() { # name, pass|fail, detail
            RESULTS+=("| $1 | $2 | $3 |")
            if [ "$2" = fail ]; then FAILED=1; echo "::error title=Android smoke: $1::$3"; else echo "PASS $1: $3"; fi
          }
          note() { echo "$1=$2" | tee -a "$OUT/timing.txt"; }
          now_ms() { date +%s%3N; }
          finish() {
            [ -n "${LOGCAT_PID:-}" ] && kill "$LOGCAT_PID" 2>/dev/null
            { echo "### Android emulator smoke test: $PKG"; echo; echo "| Check | Result | Detail |"; echo "|---|---|---|"
              printf '%s\n' "${RESULTS[@]}"; echo; echo '

  ios:
    name: iOS (simulator build check)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.3xx'
      - name: Pin Xcode and the iOS workload together
        # Each .NET for iOS release requires one exact Xcode. Workload set 10.0.300 ships iOS 26.2, which requires
        # Xcode 26.3; the hosted image keeps it side by side with its 26.6 default. Bump both together.
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          dotnet workload install ios --version 10.0.300
      - name: Build for the simulator (no signing)
        # Store builds need an Apple Developer account, a distribution certificate and a provisioning profile.
        # This job proves the iOS head compiles.
        run: dotnet build ${{ env.PROJECT }} -f net10.0-ios -c Release -r iossimulator-arm64 -p:PacTargetFrameworks=net10.0-ios
